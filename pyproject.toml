[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosam3d"
version = "0.1.0"
description = "Geodesic-aware 3D scene segmentation from monocular video."
authors = [{name = "Arun Sharma", email = "arun08sharma@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scipy>=1.12",
  "trimesh>=4.4",
  "tqdm>=4.66",
  "wandb>=0.16",
  "huggingface_hub>=0.24",
  "imageio>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
space = ["gradio>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
